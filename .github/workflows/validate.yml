name: Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-ci:
    name: Complete v0.2 Contract Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run complete v0.2 contract suite
        run: npm run test:contract-ci
